name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.22"
          python-version: "3.12"
      - name: Dependências (do uv.lock)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Formatação
        run: uv run ruff format --check .
      - name: Testes
        run: uv run pytest -q
