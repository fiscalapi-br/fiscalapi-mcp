[project]
name = "fiscalapi-mcp"
version = "0.1.0"
description = "Servidor MCP da FiscalAPI: Inscrição Estadual, CNPJ, certidões e XML de NF-e para agentes de IA."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
    "mcp==2.3.0",
    "uvicorn==0.54.0",
    "validador-ie==0.2.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.uv]
# Aplicação, não biblioteca: nada a construir nem publicar no PyPI.
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
